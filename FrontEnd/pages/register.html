<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - JobNest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
<!-- Logo en haut à droite -->
<div class="absolute top-0 right-0 -mr-20 -mt-20">
    <div class="w-64 h-64 rounded-full bg-gradient-to-br from-purple-400 to-purple-600 flex items-center justify-center opacity-90">
        <span class="text-white text-8xl font-bold">J</span>
    </div>
</div>

<div class="container mx-auto px-4 py-8 min-h-screen flex items-center justify-center">
    <div class="grid lg:grid-cols-2 gap-12 items-center max-w-6xl w-full">
        <!-- Illustration côté gauche -->
        <div class="hidden lg:flex justify-center">
            <img src="../assets/images/" alt="Signup Illustration" class="w-full max-w-md">
        </div>

        <!-- Formulaire côté droit -->
        <div class="w-full max-w-md mx-auto">
            <h1 class="text-4xl font-bold text-gray-900 text-center mb-8">Signup</h1>

            <!-- Tabs Talent / Recruiter -->
            <div class="flex border-b border-gray-200 mb-8">
                <button class="flex-1 pb-3 text-center font-semibold text-purple-600 border-b-2 border-purple-600">
                    Talent
                </button>
                <button class="flex-1 pb-3 text-center font-semibold text-gray-500 hover:text-gray-700">
                    Recruiter
                </button>
            </div>

            <!-- Formulaire -->
            <form class="space-y-5">
                <!-- FirstName -->
                <div>
                    <label class="block text-sm font-semibold text-gray-900 mb-2">
                        FirstName
                    </label>
                    <input
                            type="text"
                            placeholder="FirstName"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    >
                </div>

                <!-- LastName -->
                <div>
                    <label class="block text-sm font-semibold text-gray-900 mb-2">
                        LastName
                    </label>
                    <input
                            type="text"
                            placeholder="LastName"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    >
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-semibold text-gray-900 mb-2">
                        Email
                    </label>
                    <input
                            type="email"
                            placeholder="Email Address"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-semibold text-gray-900 mb-2">
                        Password
                    </label>
                    <input
                            type="password"
                            placeholder="Password"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    >
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm font-semibold text-gray-900 mb-2">
                        Confirm Password
                    </label>
                    <input
                            type="password"
                            placeholder="Confirm Password"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    >
                </div>

                <!-- Bouton Signup -->
                <button
                        type="submit"
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-lg transition duration-200 mt-6"
                >
                    Signup
                </button>
            </form>

            <!-- Lien Login -->
            <p class="text-center text-gray-600 mt-6">
                Already have an account?
                <a href="#" class="text-purple-600 hover:text-purple-700 font-semibold">Login</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
