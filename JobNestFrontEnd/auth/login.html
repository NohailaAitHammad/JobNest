<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JobNest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../node_modules/axios/dist/axios.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-white min-h-screen flex items-center justify-center illustration-bg">
<div class="w-full max-w-6xl grid grid-cols-2 gap-12 items-center p-8">
    <div class="hidden lg:block">
        <img src="../assets/images/login.png" alt="Login illustration" class="w-full rounded-2xl">
    </div>
    <div class="max-w-md mx-auto w-full">
        <h1 class="text-4xl font-bold text-center mb-8">Login</h1>

        <form class="space-y-6" name="formLogin" id="formLogin">
            <div>
                <label class="block text-sm font-medium mb-2">Email</label>
                <input type="email" placeholder="Email" name="email" id="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 form-input">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Password</label>
                <input type="password" placeholder="Password" name="password" id="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 form-input">
            </div>
            <button type="submit" class="w-full py-3 bg-purple-700 text-white rounded-lg font-medium hover:bg-purple-800 transition-colors">Login</button>

            <p class="text-center text-sm text-gray-600 mt-4">
                Don't have a Candidat account ? <a href="signUpCandidat.html" class="text-blue-600 hover:underline">Sign Up</a>
            </p>

            <p class="text-center text-sm text-gray-600 mt-4">
                Don't have a Recruteur account ? <a href="signUpRecruteur.html" class="text-blue-600 hover:underline">Sign Up</a>
            </p>
        </form>
    </div>
</div>
</body>


<script type="module" src="../js/api.js"></script>
<script type="module" src="../js/auth.js"></script>
</html>
