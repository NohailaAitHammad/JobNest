<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding Profile Setup - JobNest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">

</head>
<body class="bg-white min-h-screen flex items-center justify-center illustration-bg p-8">
    <div class="max-w-2xl w-full bg-white p-8 rounded-2xl shadow-sm">
        <h1 class="text-3xl font-bold text-center mb-8">Onboarding Profile Setup</h1>

        <form class="space-y-6">
            <div class="flex items-center gap-4 mb-6">
                <button type="button" class="w-10 h-10 bg-purple-700 text-white rounded-full flex items-center justify-center hover:bg-purple-800 transition-colors">
                    <i class="fas fa-plus"></i>
                </button>
                <span class="text-gray-700">Profile Picture Upload</span>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">Headline / Job Title</label>
                <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 appearance-none bg-white cursor-pointer">
                    <option>e.g., "UI/UX Designer"</option>
                    <option>Frontend Developer</option>
                    <option>Backend Developer</option>
                    <option>Full Stack Developer</option>
                    <option>Product Manager</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">Location</label>
                <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 appearance-none bg-white cursor-pointer">
                    <option>Current Location</option>
                    <option>Remote</option>
                    <option>New York</option>
                    <option>Paris</option>
                    <option>London</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">Phone</label>
                <input type="tel" placeholder="Phone" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 form-input">
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">Upload Resume</label>
                <div class="relative">
                    <input type="text" placeholder="Upload Resume" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 form-input">
                    <i class="fas fa-folder-open absolute right-3 top-3 text-purple-700 cursor-pointer"></i>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">Upload Certificat</label>
                <div class="relative">
                    <input type="text" placeholder="Upload Certificat" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 form-input">
                    <i class="fas fa-folder-open absolute right-3 top-3 text-purple-700 cursor-pointer"></i>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">Skills Tags</label>
                <div class="flex items-center gap-2">
                    <input type="text" placeholder="Skills Tags" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 form-input">
                    <button type="button" class="text-purple-700 hover:text-purple-800"><i class="fas fa-plus"></i></button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">Portfolio Links</label>
                <div class="flex items-center gap-2">
                    <input type="text" placeholder="Portfolio Links" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 form-input">
                    <button type="button" class="text-purple-700 hover:text-purple-800"><i class="fas fa-plus"></i></button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">Short Bio / Summary</label>
                <textarea placeholder="Summary" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 h-24 resize-none form-input"></textarea>
            </div>

            <div class="flex gap-4 pt-4">
                <button type="submit" class="px-8 py-3 bg-purple-700 text-white rounded-lg font-medium hover:bg-purple-800 transition-colors">Signup</button>
                <button type="button" class="px-8 py-3 border border-purple-700 text-purple-700 rounded-lg font-medium hover:bg-purple-50 transition-colors">Skip</button>
            </div>
        </form>
    </div>
</body>
</html>
