<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Proposal - JobNest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white">
<!-- Navigation -->
<nav class="bg-white shadow-sm px-8 py-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-8">
            <div class="w-10 h-10 bg-purple-700 rounded-lg flex items-center justify-center text-white font-bold text-2xl">J</div>
            <div class="hidden md:flex gap-6 text-sm font-medium">
                <a href="dashboard-employer.html" class="text-gray-600 hover:text-purple-700">Dashboard</a>
                <a href="search-talent.html" class="text-gray-600 hover:text-purple-700">Search Talent</a>
                <a href="proposals.html" class="text-gray-600 hover:text-purple-700">My Proposals</a>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="relative hidden md:block">
                <input type="text" placeholder="Search Talent" class="pl-10 pr-4 py-2 border border-purple-200 rounded-lg w-80 focus:outline-none focus:border-purple-600">
                <i class="fas fa-search absolute left-3 top-3 text-purple-600"></i>
            </div>
            <button class="p-2 text-gray-600 hover:text-purple-700"><i class="fas fa-cog text-xl"></i></button>
            <button class="p-2 text-gray-600 hover:text-purple-700"><i class="fas fa-bell text-xl"></i></button>
            <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&auto=format&fit=crop" class="w-10 h-10 rounded-full border-2 border-purple-200">
        </div>
    </div>
</nav>

<!-- Form -->
<div class="max-w-3xl mx-auto px-8 py-12">
    <div class="text-right mb-4">
        <button class="text-purple-700 hover:underline">Preview</button>
    </div>

    <div class="bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
        <form class="space-y-6">
            <div>
                <label class="block text-sm font-bold mb-2">Job Title</label>
                <input type="text" placeholder='e.g., "UI/UX Designer"' class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold mb-2">Employment Type</label>
                    <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 appearance-none bg-white">
                        <option>Full-time, Part-time, Contract, Internship</option>
                        <option>Full-time</option>
                        <option>Part-time</option>
                        <option>Contract</option>
                        <option>Internship</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Job Domaine</label>
                    <input type="text" placeholder="e.g., Design, Development" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold mb-2">Job Contrat</label>
                    <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 appearance-none bg-white">
                        <option>Job Contrat</option>
                        <option>CDI</option>
                        <option>CDD</option>
                        <option>Freelance</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Job Location</label>
                    <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 appearance-none bg-white">
                        <option>City, State, Country</option>
                        <option>Remote</option>
                        <option>On-site</option>
                        <option>Hybrid</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold mb-2">Salary Range (Optional)</label>
                    <input type="text" placeholder="Min/Max" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Duration</label>
                    <input type="text" placeholder="Duration" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold mb-2">Job Description</label>
                    <textarea placeholder="Describe the role, daily tasks, company..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 h-32 resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Personal Message</label>
                    <textarea placeholder="Thanks for applying..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 h-32 resize-none"></textarea>
                </div>
            </div>
        </form>
    </div>

    <div class="flex gap-4 mt-8">
        <button class="px-8 py-3 bg-purple-700 text-white rounded-lg font-medium hover:bg-purple-800">Send Proposal</button>
        <button class="px-8 py-3 border border-red-400 text-red-600 rounded-lg font-medium hover:bg-red-50">Cancel</button>
    </div>
</div>

<!-- Footer -->
<footer class="bg-purple-900 text-white py-12 px-8 mt-16">
    <div class="max-w-7xl mx-auto grid grid-cols-4 gap-8">
        <div>
            <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center text-purple-900 font-bold text-2xl mb-4">J</div>
            <p class="text-sm text-purple-200">Copyright © 2025 J</p>
        </div>
        <div>
            <h4 class="font-bold mb-4">Company</h4>
            <ul class="space-y-2 text-sm text-purple-200">
                <li><a href="#" class="hover:text-white">About us</a></li>
                <li><a href="#" class="hover:text-white">Services</a></li>
                <li><a href="#" class="hover:text-white">Contact us</a></li>
            </ul>
        </div>
        <div>
            <h4 class="font-bold mb-4">Support</h4>
            <ul class="space-y-2 text-sm text-purple-200">
                <li><a href="#" class="hover:text-white">Help center</a></li>
                <li><a href="#" class="hover:text-white">Privacy policy</a></li>
            </ul>
        </div>
        <div>
            <h4 class="font-bold mb-4">Legal</h4>
            <ul class="space-y-2 text-sm text-purple-200">
                <li><a href="#" class="hover:text-white">Terms of Service</a></li>
                <li><a href="#" class="hover:text-white">Cookie Policy</a></li>
            </ul>
        </div>
    </div>
</footer>
</body>
</html>
