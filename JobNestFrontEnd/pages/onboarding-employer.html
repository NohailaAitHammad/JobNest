<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding Employer - JobNest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-pattern { background: radial-gradient(circle at top right, #d8b4fe 0%, transparent 40%); }
    </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center bg-pattern p-8">
<div class="max-w-2xl w-full">
    <h1 class="text-3xl font-bold text-center mb-8">Onboarding Profile Setup</h1>

    <form class="space-y-6">
        <div class="flex items-center gap-4 mb-6">
            <button type="button" class="w-10 h-10 bg-purple-700 text-white rounded-full flex items-center justify-center">
                <i class="fas fa-plus"></i>
            </button>
            <span class="text-gray-700">Profile Picture Upload</span>
        </div>

        <div>
            <label class="block text-sm font-bold mb-2">Domaine</label>
            <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 appearance-none bg-white">
                <option>Industry Selection</option>
                <option>Technology</option>
                <option>Design</option>
                <option>Marketing</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-bold mb-2">Company Name</label>
            <input type="text" placeholder="Company Name" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
        </div>

        <div>
            <label class="block text-sm font-bold mb-2">About the Company</label>
            <textarea placeholder="About the Company" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 h-24 resize-none"></textarea>
        </div>

        <div>
            <label class="block text-sm font-bold mb-2">Country</label>
            <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 appearance-none bg-white">
                <option>Country</option>
                <option>USA</option>
                <option>France</option>
                <option>UK</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-bold mb-2">Nmuber Employers</label>
            <input type="number" placeholder="Number Employers" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
        </div>

        <div class="flex gap-4 pt-4">
            <button type="submit" class="px-8 py-3 bg-purple-700 text-white rounded-lg font-medium hover:bg-purple-800">Signup</button>
            <button type="button" class="px-8 py-3 border border-purple-700 text-purple-700 rounded-lg font-medium hover:bg-purple-50">Skip</button>
        </div>
    </form>
</div>
</body>
</html>
